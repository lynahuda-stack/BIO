<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Perizinan Keluar Masuk Siswa</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .card {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    input[type="text"], select, textarea, input[type="time"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    .btn-submit {
      background-color: #28a745;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
    }
    .btn-submit:hover {
      background-color: #218838;
    }
    .btn-cancel {
      background-color: #6c757d;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background-color: white;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .status-keluar {
      color: #dc3545;
      font-weight: bold;
    }
    .status-kembali {
      color: #28a745;
      font-weight: bold;
    }
    /* Tombol Aksi */
    .btn-action {
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-right: 2px;
    }
    .btn-kembali { background-color: #007bff; color: white; }
    .btn-kembali:hover { background-color: #0056b3; }
    .btn-edit { background-color: #ffc107; color: #333; }
    .btn-edit:hover { background-color: #e0a800; }
    .btn-hapus { background-color: #dc3545; color: white; }
    .btn-hapus:hover { background-color: #c82333; }
    .action-group {
      display: flex;
      gap: 4px;
      align-items: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Sistem Perizinan Keluar Masuk Siswa</h2>
  
  <!-- Formulir Input -->
  <div class="card">
    <h3 id="formTitle">Input Izin Siswa Baru</h3>
    <form id="izinForm">
      <input type="hidden" id="editId" value="">

      <div class="form-group">
        <label for="nama">Nama Siswa</label>
        <input type="text" id="nama" placeholder="Masukkan nama siswa" required>
      </div>

      <div class="form-group">
        <label for="kelas">Kelas</label>
        <select id="kelas" required>
          <option value="">-- Pilih Kelas --</option>
          <option value="X-1">X-1</option>
          <option value="X-2">X-2</option>
          <option value="X-3">X-3</option>
          <option value="X-4">X-4</option>
          <option value="XI-1">XI-1</option>
          <option value="XI-2">XI-2</option>
          <option value="XI-3">XI-3</option>
          <option value="XI-4">XI-4</option>
          <option value="XII-1">XII-1</option>
          <option value="XII-2">XII-2</option>
          <option value="XII-3">XII-3</option>
          <option value="XII-4">XII-4</option>
        </select>
      </div>

      <div class="form-group">
        <label for="alasan">Alasan Keluar</label>
        <textarea id="alasan" rows="3" placeholder="Alasan meninggalkan area sekolah" required></textarea>
      </div>

      <div class="form-group">
        <label for="waktuKeluar">Waktu Keluar</label>
        <input type="time" id="waktuKeluar" required>
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">Simpan Izin Keluar</button>
      <button type="button" id="btnCancel" class="btn-cancel" onclick="resetForm()">Batal Edit</button>
    </form>
  </div>

  <!-- Tabel Rekap Data -->
  <div class="card">
    <h3>Rekapitulasi Izin Siswa</h3>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Tanggal</th>
            <th>Nama Siswa</th>
            <th>Kelas</th>
            <th>Alasan</th>
            <th>Waktu Keluar</th>
            <th>Waktu Kembali</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelData">
          <!-- Data otomatis diisi oleh JS -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const izinForm = document.getElementById('izinForm');
  const tabelData = document.getElementById('tabelData');
  const editIdInput = document.getElementById('editId');
  const formTitle = document.getElementById('formTitle');
  const btnSubmit = document.getElementById('btnSubmit');
  const btnCancel = document.getElementById('btnCancel');

  document.addEventListener('DOMContentLoaded', () => {
    setDefaultWaktuKeluar();
    loadData();
  });

  function setDefaultWaktuKeluar() {
    const skrg = new Date();
    const jamSekarang = String(skrg.getHours()).padStart(2, '0') + ':' + String(skrg.getMinutes()).padStart(2, '0');
    document.getElementById('waktuKeluar').value = jamSekarang;
  }

  // Handle Form Submit (Bisa untuk Simpan Baru maupun Update Edit)
  izinForm.addEventListener('submit', function(e) {
    e.preventDefault();

    const id = editIdInput.value;
    const nama = document.getElementById('nama').value;
    const kelas = document.getElementById('kelas').value;
    const alasan = document.getElementById('alasan').value;
    const waktuKeluar = document.getElementById('waktuKeluar').value;

    let listIzin = JSON.parse(localStorage.getItem('listIzinSiswa')) || [];

    if (id) {
      // Modus EDIT: Update data lama
      listIzin = listIzin.map(item => {
        if (item.id == id) {
          return { ...item, nama, kelas, alasan, waktuKeluar };
        }
        return item;
      });
    } else {
      // Modus BARU: Tambah data baru
      const dataIzin = {
        id: Date.now(),
        tanggal: new Date().toLocaleDateString('id-ID'),
        nama: nama,
        kelas: kelas,
        alasan: alasan,
        waktuKeluar: waktuKeluar,
        waktuKembali: '-'
      };
      listIzin.push(dataIzin);
    }

    localStorage.setItem('listIzinSiswa', JSON.stringify(listIzin));
    resetForm();
    loadData();
  });

  // Tampilkan data ke tabel
  function loadData() {
    tabelData.innerHTML = '';
    let listIzin = JSON.parse(localStorage.getItem('listIzinSiswa')) || [];

    if (listIzin.length === 0) {
      tabelData.innerHTML = '<tr><td colspan="8" style="text-align:center;">Belum ada data perizinan.</td></tr>';
      return;
    }

    listIzin.forEach((item, index) => {
      const tr = document.createElement('tr');
      
      const statusKembaliBtn = item.waktuKembali === '-' 
        ? `<button class="btn-action btn-kembali" onclick="catatKembali(${item.id})">Set Kembali</button>` 
        : `<span class="status-kembali">${item.waktuKembali}</span>`;

      tr.innerHTML = `
        <td>${index + 1}</td>
        <td>${item.tanggal}</td>
        <td>${item.nama}</td>
        <td>${item.kelas}</td>
        <td>${item.alasan}</td>
        <td class="status-keluar">${item.waktuKeluar}</td>
        <td>${statusKembaliBtn}</td>
        <td>
          <div class="action-group">
            <button class="btn-action btn-edit" onclick="editData(${item.id})">Edit</button>
            <button class="btn-action btn-hapus" onclick="hapusData(${item.id})">Hapus</button>
          </div>
        </td>
      `;

      tabelData.appendChild(tr);
    });
  }

  // Fungsi Catat Jam Kembali
  function catatKembali(id) {
    let listIzin = JSON.parse(localStorage.getItem('listIzinSiswa')) || [];
    const skrg = new Date();
    const jamKembali = String(skrg.getHours()).padStart(2, '0') + ':' + String(skrg.getMinutes()).padStart(2, '0');

    listIzin = listIzin.map(item => {
      if (item.id === id) {
        item.waktuKembali = jamKembali;
      }
      return item;
    });

    localStorage.setItem('listIzinSiswa', JSON.stringify(listIzin));
    loadData();
  }

  // FITUR EDIT: Isi form dengan data yang dipilih
  function editData(id) {
    let listIzin = JSON.parse(localStorage.getItem('listIzinSiswa')) || [];
    const item = listIzin.find(data => data.id === id);

    if (item) {
      editIdInput.value = item.id;
      document.getElementById('nama').value = item.nama;
      document.getElementById('kelas').value = item.kelas;
      document.getElementById('alasan').value = item.alasan;
      document.getElementById('waktuKeluar').value = item.waktuKeluar;

      formTitle.textContent = "Edit Data Izin Siswa";
      btnSubmit.textContent = "Update Data";
      btnCancel.style.display = "block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  // FITUR HAPUS: Menghapus baris data
  function hapusData(id) {
    if (confirm("Apakah Anda yakin ingin menghapus data perizinan ini?")) {
      let listIzin = JSON.parse(localStorage.getItem('listIzinSiswa')) || [];
      listIzin = listIzin.filter(item => item.id !== id);
      localStorage.setItem('listIzinSiswa', JSON.stringify(listIzin));
      loadData();
    }
  }

  // Reset Form ke keadaan semula (Tambah Baru)
  function resetForm() {
    izinForm.reset();
    editIdInput.value = '';
    formTitle.textContent = "Input Izin Siswa Baru";
    btnSubmit.textContent = "Simpan Izin Keluar";
    btnCancel.style.display = "none";
    setDefaultWaktuKeluar();
  }
</script>

</body>
</html>
