<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CBT Ujian Biologi - Metabolisme </title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        /* Header & Timer */
        .header-cbt { display: flex; flex-direction: column; gap: 10px; border-bottom: 2px solid #27ae60; padding-bottom: 15px; margin-bottom: 20px; }
        @media (min-width: 600px) {
            .header-cbt { flex-direction: row; justify-content: space-between; align-items: center; }
        }
        #timer-box { background: #e74c3c; color: white; padding: 10px 20px; border-radius: 30px; font-weight: bold; font-size: 1.1em; text-align: center; }
        
        /* Panel Nomor Soal */
        .number-panel { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; justify-content: flex-start; }
        .num-btn { width: 38px; height: 38px; border: 1px solid #ddd; background: #f8f9fa; cursor: pointer; border-radius: 6px; font-weight: 600; font-size: 0.9em; }
        .num-btn.active { background: #27ae60; color: white; border-color: #219150; }
        .num-btn.filled { background: #2ecc71; color: white; border-color: #27ae60; }

        /* Area Soal & Pilihan */
        .question-area { background: #fff; padding: 15px; border: 1px solid #e1e4e8; border-radius: 8px; }
        #question-text { font-size: 1.05em; line-height: 1.5; margin-top: 0; }
        .options { list-style: none; padding: 0; margin: 0; }
        .options li { margin: 10px 0; padding: 12px 15px; border: 1px solid #edeff2; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; }
        .options li:hover { background: #e8f8f5; border-color: #27ae60; }
        .options input { margin-right: 12px; transform: scale(1.2); cursor: pointer; }

        /* Navigasi Tombol */
        .navigation { display: flex; gap: 8px; justify-content: space-between; margin-top: 25px; flex-wrap: wrap; }
        button.nav-btn { padding: 12px 18px; border: none; background: #34495e; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; flex: 1; min-width: 100px; }
        button.nav-btn:hover { opacity: 0.9; }
        button.nav-btn:disabled { background: #bdc3c7; cursor: not-allowed; opacity: 0.6; }
        
        /* Area Hasil */
        #result-area { display: none; margin-top: 25px; padding: 20px; background: #d4edda; border-radius: 8px; border: 1px solid #c3e6cb; }
        .key-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-cbt">
        <div>
            <h2 style="margin:0; font-size: 1.4em;">Simulasi CBT Biologi</h2>
            <small style="color: #666;">Materi: Metabolisme Sel (Kelas XI)</small>
        </div>
        <div id="timer-box">Sisa Waktu: <span id="timer">40:00</span></div>
    </div>
    
    <div class="number-panel" id="number-panel"></div>

    <div class="question-area" id="question-container">
        <h3 id="question-text">Memuat soal...</h3>
        <ul class="options" id="options-list"></ul>
    </div>

    <div class="navigation">
        <button class="nav-btn" id="prev-btn" onclick="manualChange(-1)">Sebelumnya</button>
        <button class="nav-btn" style="background: #e67e22;" onclick="confirmFinish()">Selesai Ujian</button>
        <button class="nav-btn" id="next-btn" onclick="manualChange(1)">Selanjutnya</button>
    </div>

    <div id="result-area">
        <h2 id="score-text" style="margin-top:0; color: #155724;"></h2>
        <p><strong>Kunci Jawaban Soal:</strong></p>
        <div id="key-list" class="key-grid"></div>
    </div>
</div>

<script>
    const questions = [
        { q: "Bagian protein dari enzim yang bersifat termolabil dinamakan...", a: ["Koenzim", "Apoenzim", "Holoenzim", "Kofaktor", "Gugus prostetik"], correct: 1 },
        { q: "Komponen non-protein berupa molekul organik kompleks yang membantu fungsi enzim disebut...", a: ["Apoenzim", "Koenzim", "Glikolipid", "Substrat", "Asam amino"], correct: 1 },
        { q: "Pernyataan yang BENAR mengenai sifat-sifat enzim adalah...", a: ["Meningkatkan energi aktivasi reaksi", "Ikut bereaksi dan habis menjadi produk", "Bekerja secara spesifik pada substrat tertentu", "Dapat bekerja optimum pada semua tingkat suhu dan pH", "Mengubah arah keseimbangan reaksi kimia"], correct: 2 },
        { q: "Teori yang menyatakan bahwa sisi aktif enzim bersifat fleksibel dan menyesuaikan bentuk substrat adalah teori...", a: ["Lock and Key", "Induced Fit (Ketepatan Induksi)", "Kunci dan Gembok", "Halangan Sterik", "Inhibisi Umpan Balik"], correct: 1 },
        { q: "Inhibitor kompetitif menghambat kerja enzim dengan cara...", a: ["Merusak struktur tersier enzim secara permanen", "Mengikat bagian alosterik sehingga bentuk sisi aktif berubah", "Bersaing dengan substrat untuk mengikat sisi aktif enzim", "Menghentikan sintesis enzim dari DNA", "Mengikat hasil reaksi sehingga tidak bisa dilepaskan"], correct: 2 },
        { q: "Jika suhu tempat enzim bekerja dinaikkan jauh di atas suhu optimum, maka enzim akan mengalami...", a: ["Aktivasi total", "Denaturasi", "Kristalisasi", "Renaturasi sempurna", "Penggandaan molekul"], correct: 1 },
        { q: "Enzim pepsin di dalam lambung bekerja optimum pada kondisi...", a: ["Asam tinggi (pH 1,5 - 2)", "Netral (pH 7)", "Basa kuat (pH 12)", "Basa lemah (pH 8)", "Tidak terpengaruh pH"], correct: 0 },
        { q: "Tahapan respirasi aerob yang berlangsung di dalam sitosol (sitoplasma) adalah...", a: ["Dekarboksilasi Oksidatif", "Siklus Krebs", "Glikolisis", "Transpor Elektron", "Fotofosforilasi"], correct: 2 },
        { q: "Hasil akhir dari tahapan glikolisis untuk 1 molekul glukosa adalah...", a: ["2 Asam Piruvat, 2 NADH, dan 2 ATP", "2 Asetil Ko-A, 2 CO2, dan 2 NADH", "6 CO2, 2 FADH2, dan 2 ATP", "2 Asam Laktat dan 4 ATP", "36 ATP dan 6 H2O"], correct: 0 },
        { q: "Sebelum memasuki Siklus Krebs, asam piruvat diubah terlebih dahulu menjadi Asetil Ko-A melalui tahap...", a: ["Glikolisis", "Dekarboksilasi Oksidatif", "Fermentasi Alkohol", "Transfer Elektron", "Reaksi Terang"], correct: 1 },
        { q: "Tahapan respirasi seluler yang menghasilkan ATP terbanyak dan terjadi di membran dalam mitokondria (krista) adalah...", a: ["Siklus Krebs", "Glikolisis", "Transpor Elektron", "Daur Asam Sitrat", "Dekarboksilasi Oksidatif"], correct: 2 },
        { q: "Akseptor elektron terakhir pada sistem transpor elektron respirasi aerob adalah...", a: ["NAD+", "FAD", "Koenzim A", "Oksigen (O2)", "Karbon dioksida (CO2)"], correct: 3 },
        { q: "Pada saat sel otot manusia kekurangan oksigen, terjadi respirasi anaerob yang menghasilkan zat penyebab rasa pegal, yaitu...", a: ["Asam Piruvat", "Etanol", "Asam Laktat", "Asetaldehid", "Asam Sitrat"], correct: 2 },
        { q: "Pengertian dari anabolisme yang tepat di bawah ini adalah...", a: ["Reaksi pemecahan molekul kompleks menjadi sederhana yang membebaskan energi", "Reaksi penyusunan molekul sederhana menjadi molekul kompleks yang memerlukan energi", "Proses pengubahan energi kimia menjadi energi gerak secara langsung", "Reaksi pelepasan elektron dari senyawa organik", "Proses pembentukan glukosa tanpa bantuan zat perantara"], correct: 1 },
        { q: "Reaksi terang pada proses fotosintesis terjadi pada organel sel bagian...", a: ["Stroma", "Membran luar kloroplas", "Tilakoid / Grana", "Matriks mitokondria", "Ribosom"], correct: 2 },
        { q: "Peristiwa fotolisis air pada reaksi terang fotosintesis menghasilkan...", a: ["Glukosa dan CO2", "Oksigen (O2), Proton (H+), dan Elektron", "RuBP dan APG", "NADPH dan Glukosa", "ATP dan CO2"], correct: 1 },
        { q: "Jalur fotofosforilasi siklik pada reaksi terang fotosintesis hanya melibatkan...", a: ["Fotosistem I (P700) dan menghasilkan ATP", "Fotosistem II (P680) dan menghasilkan NADPH", "Fotosistem I & II dan menghasilkan Oksigen", "Enzim Rubisco dan menghasilkan Glukosa", "Fotosistem II dan fotolisis air"], correct: 0 },
        { q: "Tempat terjadinya Reaksi Gelap (Siklus Calvin) pada kloroplas adalah...", a: ["Grana", "Stroma", "Membran tilakoid", "Sitosol", "Krista"], correct: 1 },
        { q: "Pada tahapan fiksasi karbon dalam Siklus Calvin, CO2 dari udara diikat oleh molekul...", a: ["APG (Asam Fosfogliserat)", "ALPG (Fosfogliseraldehid)", "RuBP (Ribulosa Bifosfat)", "Glukosa", "Asetil Ko-A"], correct: 2 },
        { q: "Urutan tahap yang benar dalam Siklus Calvin (Reaksi Gelap) adalah...", a: ["Reduksi -> Fiksasi -> Regenerasi", "Regenerasi -> Fiksasi -> Reduksi", "Fiksasi -> Reduksi -> Regenerasi", "Fotolisis -> Fiksasi -> Reduksi", "Fiksasi -> Fotolisis -> Regenerasi"], correct: 2 }
    ];

    let currentIdx = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let totalTime = 2400; // 40 Menit Ujian (dalam detik)
    let timerInterval;

    function init() {
        renderPanel();
        showQuestion();
        startGlobalTimer();
    }

    function startGlobalTimer() {
        timerInterval = setInterval(() => {
            totalTime--;
            updateTimerDisplay();
            
            if (totalTime <= 0) {
                clearInterval(timerInterval);
                alert("Waktu ujian telah habis!");
                finishQuiz();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(totalTime / 60);
        const seconds = totalTime % 60;
        document.getElementById('timer').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        const box = document.getElementById('timer-box');
        if (totalTime < 300) box.style.background = "#e74c3c"; // Merah jika < 5 menit
        else box.style.background = "#27ae60"; // Hijau
    }

    function showQuestion() {
        const q = questions[currentIdx];
        document.getElementById('question-text').innerText = `Soal ${currentIdx + 1}: ${q.q}`;
        const list = document.getElementById('options-list');
        list.innerHTML = '';
        
        q.a.forEach((opt, i) => {
            const li = document.createElement('li');
            const char = String.fromCharCode(65 + i);
            li.innerHTML = `<input type="radio" name="opt" ${userAnswers[currentIdx] === i ? 'checked' : ''}> <b>${char}.</b> &nbsp; ${opt}`;
            li.onclick = () => saveAnswer(i);
            list.appendChild(li);
        });

        document.getElementById('prev-btn').disabled = currentIdx === 0;
        document.getElementById('next-btn').disabled = currentIdx === questions.length - 1;
        renderPanel();
    }

    function saveAnswer(i) {
        userAnswers[currentIdx] = i;
        showQuestion();
    }

    function manualChange(step) {
        currentIdx += step;
        showQuestion();
    }

    function renderPanel() {
        const panel = document.getElementById('number-panel');
        panel.innerHTML = '';
        questions.forEach((_, i) => {
            const btn = document.createElement('button');
            btn.innerText = i + 1;
            let cls = 'num-btn';
            if (i === currentIdx) cls += ' active';
            if (userAnswers[i] !== null) cls += ' filled';
            btn.className = cls;
            btn.onclick = () => { currentIdx = i; showQuestion(); };
            panel.appendChild(btn);
        });
    }

    function confirmFinish() {
        const answeredCount = userAnswers.filter(a => a !== null).length;
        if (confirm(`Anda telah menjawab ${answeredCount} dari ${questions.length} soal. Yakin ingin mengakhiri ujian?`)) {
            finishQuiz();
        }
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        let score = 0;
        let keyHtml = '';
        
        questions.forEach((q, i) => {
            if(userAnswers[i] === q.correct) score++;
            keyHtml += `<div style="background:#fff; padding:6px; border-radius:4px; border:1px solid #c3e6cb;">Soal ${i+1}: <b>${String.fromCharCode(65 + q.correct)}</b></div>`;
        });

        const finalScore = (score / questions.length) * 100;
        document.getElementById('score-text').innerHTML = `Nilai Akhir Anda: ${finalScore}`;
        document.getElementById('key-list').innerHTML = keyHtml;
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('timer-box').style.display = 'none';
        document.getElementById('question-container').style.display = 'none';
        document.querySelector('.navigation').style.display = 'none';
        document.getElementById('number-panel').style.display = 'none';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    init();
</script>

</body>
</html>
