<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT - Biologi Kelas XI (Transpor Membran)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        /* Header & Timer */
        .header-cbt { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3498db; padding-bottom: 15px; margin-bottom: 20px; }
        #timer-box { background: #e74c3c; color: white; padding: 10px 20px; border-radius: 30px; font-weight: bold; font-size: 1.1em; min-width: 120px; text-align: center; }
        
        /* Panel Nomor */
        .number-panel { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 25px; }
        .num-btn { width: 40px; height: 40px; border: 1px solid #ddd; background: #f8f9fa; cursor: pointer; border-radius: 6px; font-weight: 600; }
        .num-btn.active { background: #3498db; color: white; border-color: #2980b9; }
        .num-btn.filled { background: #2ecc71; color: white; border-color: #27ae60; }

        /* Area Soal */
        .question-area { background: #fff; padding: 20px; border: 1px solid #e1e4e8; border-radius: 8px; }
        .options { list-style: none; padding: 0; }
        .options li { margin: 12px 0; padding: 15px; border: 1px solid #edeff2; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; }
        .options li:hover { background: #f1f8ff; border-color: #3498db; }
        .options li.selected { background: #e8f4fc; border-color: #3498db; font-weight: 600; }
        .options input { margin-right: 15px; transform: scale(1.2); }

        /* Kotak Pembahasan Hanya Berisi Tombol Mata */
        .explanation-box { margin-top: 20px; border-radius: 8px; overflow: hidden; }
        .exp-header-bar { display: flex; justify-content: flex-end; align-items: center; padding: 5px 0; }
        .exp-eye-btn { background: #3498db; color: white; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 1.3em; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        .exp-eye-btn:hover { background: #2980b9; transform: scale(1.08); }
        .exp-content { display: none; padding: 15px; font-size: 0.95em; color: #2d3748; line-height: 1.5; background: #f8f9fa; border: 1px solid #dcdfe6; border-radius: 8px; margin-top: 8px; }

        /* Navigasi */
        .navigation { display: flex; justify-content: space-between; margin-top: 30px; }
        button.nav-btn { padding: 12px 25px; border: none; background: #34495e; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button.nav-btn:hover { opacity: 0.9; }
        button.nav-btn:disabled { background: #bdc3c7; cursor: not-allowed; }
        
        /* Area Hasil */
        #result-area { display: none; margin-top: 30px; padding: 20px; background: #eef9f1; border-radius: 8px; border: 1px solid #c3e6cb; }
        .explanation-item { background: #fff; border: 1px solid #dcdfe6; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
        .explanation-header { padding: 12px 15px; background: #f8f9fa; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e1e4e8; }
        .explanation-header:hover { background: #edf2f7; }
        .explanation-body { display: none; padding: 15px; font-size: 0.95em; color: #2d3748; line-height: 1.5; background: #fff; }
        .badge-correct { color: #27ae60; font-weight: bold; }
        .badge-wrong { color: #e74c3c; font-weight: bold; }

        /* Tabel Data Soal 14 */
        .cbt-table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.95em; }
        .cbt-table th, .cbt-table td { border: 1px solid #cbd5e0; padding: 8px 12px; text-align: center; }
        .cbt-table th { background-color: #edf2f7; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-cbt">
        <div>
            <h2 style="margin:0;">Penilaian Sumatif - Biologi</h2>
            <small>Materi: Transpor Membran Sel (Kelas XI SMA/MA)</small>
        </div>
        <div id="timer-box">Sisa Waktu: <span id="timer">04:00</span></div>
    </div>
    
    <div class="number-panel" id="number-panel"></div>

    <div class="question-area" id="question-container">
        <h3 id="question-text">Memuat soal...</h3>
        <div id="extra-question-content"></div>
        <ul class="options" id="options-list"></ul>
        
        <!-- Pembahasan Hanya Ikon Mata (Tanpa Tulisan) -->
        <div class="explanation-box">
            <div class="exp-header-bar">
                <button class="exp-eye-btn" onclick="toggleCurrentExp()" title="Tampilkan/Sembunyikan Pembahasan">
                    <span id="exp-eye-icon">🙈</span>
                </button>
            </div>
            <div class="exp-content" id="exp-content-current">
                <p style="margin-top:0;"><b>Kunci Jawaban:</b> <span id="exp-key"></span></p>
                <p style="margin-bottom:0;"><b>Pembahasan:</b> <br><span id="exp-text"></span></p>
            </div>
        </div>
    </div>

    <div class="navigation">
        <button class="nav-btn" id="prev-btn" onclick="manualChange(-1)">Sebelumnya</button>
        <button class="nav-btn" style="background: #e67e22;" onclick="confirmFinish()">Selesai Ujian</button>
        <button class="nav-btn" id="next-btn" onclick="manualChange(1)">Selanjutnya</button>
    </div>

    <div id="result-area">
        <h3 id="score-text"></h3>
        <hr style="border: 0; border-top: 1px solid #ccc; margin: 20px 0;">
        <h4 style="margin-top:0;">Hasil & Rekapitulasi Pembahasan (Klik untuk membuka/menutup):</h4>
        <div id="explanation-list"></div>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Tanaman yang diberi pupuk urea sangat pekat akan menjadi ....",
            a: [
                "subur karena kebutuhan mineralnya terpenuhi",
                "segar karena memperoleh cadangan makanan",
                "tumbuh besar karena kelebihan air",
                "berdaun lebat tapi berwarna pucat",
                "layu karena kehilangan air terlalu banyak"
            ],
            correct: 4,
            exp: "Pemberian pupuk urea yang sangat pekat menyebabkan konsentrasi cairan di luar sel akar tanaman menjadi hipertonik terhadap cairan di dalam sel akar (hipotonik). Akibatnya, air dari dalam sel tanaman keluar menuju tanah secara osmosis, menyebabkan sel tanaman kehilangan banyak air dan mengalami plasmolisis sehingga tanaman menjadi layu."
        },
        {
            q: "Transpor aktif melibatkan hal-hal berikut, kecuali ....",
            a: [
                "protein membran",
                "protein carrier",
                "ATP enzim",
                "ATP ase",
                "glikolipid"
            ],
            correct: 4,
            exp: "Transpor aktif merupakan pergerakan zat yang melawan gradien konsentrasi sehingga memerlukan bantuan protein pembawa (protein carrier/protein membran), energi (ATP), dan enzim pemecah ATP (ATPase). Glikolipid tidak terlibat langsung dalam mekanisme transpor aktif, melainkan berfungsi sebagai tanda pengenal/reseptor sel pada membran."
        },
        {
            q: "Perpindahan zat melalui membran yang memerlukan energi disebut dengan ....",
            a: [
                "transpor pasif",
                "transpor aktif",
                "difusi",
                "osmosis",
                "endositosis"
            ],
            correct: 1,
            exp: "Transpor aktif didefinisikan sebagai perpindahan molekul atau ion melintasi membran sel yang membutuhkan energi seluler (ATP) karena melawan gradien konsentrasi (dari konsentrasi rendah ke tinggi)."
        },
        {
            q: "Perbedaan antara difusi dan osmosis adalah pada difusi ....",
            a: [
                "air berpindah dari larutan hipotonik ke hipertonik",
                "air mengalir dari larutan isotonik ke hipertonik",
                "zat terlarut berpindah dari larutan hipertonik kelarutan hipotonik",
                "zat terlarut berpindah dari larutan hipotonik kelarutan hipertonik",
                "air berpindah dari larutan hipertonik ke hipotonik"
            ],
            correct: 2,
            exp: "Difusi adalah pergerakan molekul ZAT TERLARUT dari daerah berkonsentrasi tinggi (hipertonik) ke daerah berkonsentrasi rendah (hipotonik). Sebaliknya, osmosis adalah pergerakan pelarut (AIR) dari daerah berkonsentrasi larutan rendah/encer (hipotonik) ke daerah berkonsentrasi larutan tinggi/pekat (hipertonik) melalui membran semipermeabel."
        },
        {
            q: "Perbedaan fundamental antara transpor pasif dan transpor aktif dalam konteks pergerakan zat melalui membran sel adalah ....",
            a: [
                "transpor pasif selalu memerlukan energi tambahan, sedangkan transpor aktif tidak",
                "transpor aktif melibatkan pergerakan zat dari area konsentrasi tinggi ke rendah, sedangkan transpor pasif sebaliknya",
                "transpor pasif terjadi melalui protein pembawa, sedangkan transpor aktif melibatkan kanal ion",
                "transpor aktif membutuhkan energi dari sel untuk memindahkan zat melawan gradien konsentrasi, sementara transpor pasif tidak",
                "transpor aktif dan transpor pasif membutuhkan energi dalam proses transpor"
            ],
            correct: 3,
            exp: "Perbedaan utama (fundamental) antara transpor aktif dan pasif terletak pada kebutuhan energi dan arah pergerakannya. Transpor aktif membutuhkan energi (ATP) karena memindahkan zat melawan gradien konsentrasi, sedangkan transpor pasif tidak membutuhkan energi karena zat bergerak searah gradien konsentrasi."
        },
        {
            q: "Peristiwa mengerutnya sel pada sel tumbuhan karena air keluar dari sel disebut ....",
            a: [
                "plasmolisis",
                "hipotonik",
                "hemolisis",
                "endositosis",
                "krenasi"
            ],
            correct: 0,
            exp: "Pada sel tumbuhan, ketika air keluar dari dalam sel menuju lingkungan hipertonik, sitoplasma dan membran sel akan mengkerut dan terlepas dari dinding sel. Peristiwa lepasnya membran plasma dari dinding sel tumbuhan ini disebut PLASMOLISIS."
        },
        {
            q: "Jika sel darah merah diletakkan di dalam larutan hipertonik akan menyebabkan peristiwa ....",
            a: [
                "krenasi",
                "plasmolisis",
                "hemolisis",
                "tekanan turgor",
                "lisis"
            ],
            correct: 0,
            exp: "Sel darah merah (sel hewan) yang dimasukkan ke dalam larutan hipertonik akan kehilangan air secara osmosis sehingga sel mengerut dan berkerut-kerut. Peristiwa mengerutnya sel hewan ini dinamakan KRENASI."
        },
        {
            q: "Pada saat sel-sel epidermis umbi bawang merah direndam dalam akuades maka akan mengalami ....",
            a: [
                "plasmolisis, karena cairan sel bersifat hipotonik sehingga air di dalam sel keluar",
                "lisis, karena cairan sel bersifat hipertonik sehingga molekul-molekul air keluar dari sel",
                "krenasi, karena cairan sel bersifat isotonik sehingga molekul-molekul air keluar dari sel",
                "krenasi, karena cairan sel bersifat hipotonik sehingga molekul-molekul gula masuk ke dalam sel",
                "e. turgid, karena cairan sel bersifat hipertonik sehingga air dari luar sel masuk ke dalam sel"
            ],
            correct: 4,
            exp: "Akuades adalah air murni (sangat hipotonik). Cairan di dalam sel epidermis bawang merah bersifat lebih pekat (hipertonik). Oleh karena itu, air dari akuades akan berosmosis masuk ke dalam sel tumbuhan sehingga sel membesar dan menjadi kencang/tegang tetapi tidak pecah karena ditahan oleh dinding sel, yang disebut kondisi TURGID."
        },
        {
            q: "Perhatikan gambar hasil praktikum peserta didik tentang transpor pasif pada sel tumbuhan berikut!\n\n(B adalah sel sebelum diberi perlakuan. A dan C adalah sel yang mendapat perlakuan perendaman pada larutan yang berbeda konsentrasi selama 5 menit.)\n\nPenjelasan terhadap peristiwa yang terjadi adalah .... [HOTS]",
            a: [
                "A mengalami plasmolisis karena berada dalam larutan hipertonik sehingga cairan sel berosmosis ke luar sel",
                "A mengalami krenasi karena berada dalam larutan hipotonik sehingga cairan sel berosmosis ke luar sel",
                "C mengalami turgid karena berada dalam larutan hipertonik sehingga cairan sel berosmosis ke luar sel",
                "C mengalami plasmolisis karena berada dalam larutan hipertonik sehingga cairan sel berosmosis ke dalam sel",
                "A mengalami turgid karena berada dalam larutan hipotonik sehingga cairan sel berosmosis ke dalam sel"
            ],
            correct: 0,
            exp: "Pada gambar, Sel A mengalami penyusutan vakuola dan pelepasan membran dari dinding sel (plasmolisis) karena direndam dalam larutan pekat (hipertonik), yang menyebabkan air keluar dari sel. Sementara Sel C mengalami pembengkakan/turgid karena dimasukkan ke larutan hipotonik."
        },
        {
            q: "Perhatikan beberapa proses perpindahan molekul berikut ini!\n(1) osmosis\n(2) pompa ion natrium-kalium\n(3) difusi\n(4) endositosis\n(5) eksositosis\n\nProses perpindahan molekul yang membutuhkan energi adalah .... [HOTS]",
            a: [
                "(1), (2), dan (3)",
                "(1), (3), dan (4)",
                "(2), (3), dan (4)",
                "(2), (4), dan (5)",
                "(3), (4), dan (5)"
            ],
            correct: 3,
            exp: "Transpor yang memerlukan energi (ATP) adalah TRANSPOR AKTIF. Yang termasuk transpor aktif pada daftar di atas adalah: (2) pompa ion Na+-K+, (4) endositosis, dan (5) eksositosis. Sedangkan osmosis (1) dan difusi (3) adalah transpor pasif."
        },
        {
            q: "Sel darah merah yang berada dalam air suling lama-kelamaan akan pecah. Dalam peristiwa tersebut terjadi .... [HOTS]",
            a: [
                "osmosis, karena sel darah merah berada dalam keadaan hipertonik sehingga cairan sel keluar dari sel",
                "difusi, karena sel darah merah berada dalam keadaan hipertonik sehingga cairan sel keluar dari sel",
                "transpor aktif, karena sel darah merah berada dalam larutan hipotonik sehingga cairan sel keluar dari sel",
                "endositosis, karena sel darah merah berada dalam larutan hipertonik sehingga molekul air masuk ke sel",
                "hemolisis, karena sel darah merah berada dalam larutan hipotonik sehingga molekul air masuk ke sel"
            ],
            correct: 4,
            exp: "Air suling bersifat hipotonik dibandingkan cairan sel darah merah. Air akan terus menerus masuk ke dalam sel secara osmosis. Karena sel hewan tidak memiliki dinding sel, pembengkakan melebihi batas kekuatan membran akan menyebabkan sel pecah, yang dinamakan HEMOLISIS."
        },
        {
            q: "Salah satu kondisi yang terjadi pada proses transpor aktif adalah ....",
            a: [
                "mekanismenya memerlukan energi",
                "tidak dipengaruhi oleh muatan listrik",
                "gerakannya berlangsung dua arah",
                "hanya terjadi pada molekul berukuran besar",
                "dibutuhkan protein pembawa partikel"
            ],
            correct: 0,
            exp: "Ciri mutlak dan paling mendasar dari transpor aktif adalah pergerakan zat melawan gradien konsentrasi sehingga mekanismenya memerlukan energi berupa ATP."
        },
        {
            q: "Berikut yang bukan termasuk faktor yang mempengaruhi proses difusi adalah ....",
            a: [
                "konsentrasi zat",
                "ukuran zat",
                "suhu",
                "tempat terjadinya difusi",
                "wujud zat"
            ],
            correct: 3,
            exp: "Faktor-faktor yang mempengaruhi kecepatan difusi meliputi: gradien konsentrasi zat, ukuran partikel/zat, suhu, dan wujud/fase zat. Lokasi/tempat spesifik secara langsung tidak tergolong sebagai parameter fisika penentu laju difusi."
        },
        {
            q: "Farid dan teman-temannya melakukan percobaan terhadap sel kentang. Dalam melakukan percobaan tersebut, mereka menyiapkan tiga potongan kentang berbentuk silinder dengan ukuran dan massa yang sama. Kentang direndam dalam larutan yang sama, tetapi konsentrasi berbeda. Hasil pengamatan yang diperoleh sebagai berikut:\n\nKesimpulan dari percobaan Farid dan teman-temannya berdasarkan tabel adalah .... [HOTS]",
            a: [
                "larutan gula hipotonik terhadap cairan sel",
                "larutan gula hipertonik terhadap cairan sel",
                "sel-sel kentang pecah karena masuknya larutan gula",
                "cairan sel isotonik terhadap larutan gula",
                "larutan gula isotonik terhadap cairan sel"
            ],
            extraTable: true,
            correct: 1,
            exp: "Massa potongan kentang mengalami pengurangan (berkurang massa). Hal ini menunjukkan bahwa molekul air dari dalam sel kentang keluar menuju larutan gula di sekelilingnya secara osmosis. Hal ini membuktikan bahwa larutan gula bersifat HIPERTONIK (lebih pekat) dibandingkan cairan sel kentang."
        },
        {
            q: "Transpor membran yang tergolong transpor pasif adalah ....",
            a: [
                "pinositosis",
                "osmosis",
                "fagositosis",
                "eksositosis",
                "endositosis"
            ],
            correct: 1,
            exp: "Transpor pasif meliputi difusi sederhana, difusi terfasilitasi, dan OSMOSIS. Sedangkan pinositosis, fagositosis, endositosis, dan eksositosis tergolong ke dalam transpor aktif massa (menggunakan vesikel dan butuh ATP)."
        },
        {
            q: "Fagositosis berperan pada makhluk hidup uniseluler misalnya ....",
            a: [
                "Amoeba",
                "mammalia",
                "aves",
                "Paramecium",
                "cacing"
            ],
            correct: 0,
            exp: "Organisme uniseluler seperti Amoeba menggunakan mekanisme fagositosis (memakan sel/partikel padat) dengan cara menjulurkan pseudopodia (kaki semu) untuk mengurung dan menelan nutrisi."
        },
        {
            q: "Peristiwa yang akan terjadi apabila sel hewan diletakkan dalam medium yang bersifat hipertonik adalah ....",
            a: [
                "plasmolisis karena plasma sel akan keluar",
                "plasmolisis karena air di dalam sel akan keluar",
                "krenasi karena air dalam sel akan keluar sel",
                "lisis karena air di luar sel akan masuk ke dalam sel",
                "tekanan turgor meningkat dan akan terjadi lisis"
            ],
            correct: 2,
            exp: "Apabila sel hewan berada dalam medium yang hipertonik, air dari dalam sel akan keluar secara osmosis. Akibatnya, sel hewan kehilangan volume cairan dan mengerut yang disebut peristiwa KRENASI."
        },
        {
            q: "Sel hewan dan sel tumbuhan memerlukan ion K+ untuk aktivitas hidupnya. Pemasukan ion K+ ke dalam sel dilakukan secara .... [HOTS]",
            a: [
                "difusi",
                "fagositosis",
                "osmosis",
                "pinositosis",
                "transpor aktif"
            ],
            correct: 4,
            exp: "Pemasukan ion Kalium (K+) ke dalam sel terjadi melawan gradien konsentrasi (konsentrasi K+ di dalam sel jauh lebih tinggi dibanding di luar sel). Proses ini dipompa menggunakan energi ATP melalui mekanisme Pompa Sodium-Kalium (Na+/K+), yang merupakan bagian dari TRANSPOR AKTIF."
        },
        {
            q: "Perpindahan molekul atau ion tanpa menggunakan energi sel. Perpindahan molekul tersebut terjadi secara spontan dari konsentrasi tinggi ke rendah disebut ....",
            a: [
                "endositosis",
                "eksositosis",
                "transpor aktif",
                "transpor langsung",
                "transpor pasif"
            ],
            correct: 4,
            exp: "Perpindahan molekul/ion melintasi membran yang berlangsung secara spontan dari daerah konsentrasi tinggi ke konsentrasi rendah tanpa mengonsumsi energi seluler (ATP) didefinisikan sebagai TRANSPOR PASIF."
        },
        {
            q: "Perpindahan molekul-molekul dari konsentrasi tinggi ke konsentrasi rendah baik melalui membran plasma ataupun tidak disebut ....",
            a: [
                "endositosis",
                "eksositosis",
                "transpor aktif",
                "difusi",
                "osmosis"
            ],
            correct: 3,
            exp: "DIFUSI adalah proses penyebaran atau perpindahan partikel/molekul dari area berkonsentrasi tinggi menuju daerah berkonsentrasi rendah, yang dapat berlangsung melalui membran sel permeable/semipermeable maupun dalam media bebas tanpa membran."
        }
    ];

    let currentIdx = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let timeLeft = 240; 
    let timerInterval;

    function init() {
        renderPanel();
        showQuestion();
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 240; 
        updateTimerDisplay();
        
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            
            if (timeLeft <= 0) {
                autoNext();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        document.getElementById('timer').innerText = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        const box = document.getElementById('timer-box');
        if (timeLeft < 60) box.style.background = "#f39c12";
        else box.style.background = "#e74c3c";
    }

    function showQuestion() {
        const q = questions[currentIdx];
        document.getElementById('question-text').innerText = `Soal ${currentIdx + 1}: ${q.q}`;
        
        const extraDiv = document.getElementById('extra-question-content');
        if (q.extraTable) {
            extraDiv.innerHTML = `
                <table class="cbt-table">
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Larutan Gula (%)</th>
                            <th>Berkurangnya Massa Kentang (gram)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td>1.</td><td>5</td><td>0,5</td></tr>
                        <tr><td>2.</td><td>10</td><td>0,9</td></tr>
                        <tr><td>3.</td><td>15</td><td>1,8</td></tr>
                    </tbody>
                </table>
            `;
        } else {
            extraDiv.innerHTML = '';
        }

        const list = document.getElementById('options-list');
        list.innerHTML = '';
        
        q.a.forEach((opt, i) => {
            const li = document.createElement('li');
            const char = String.fromCharCode(65 + i);
            const isSelected = userAnswers[currentIdx] === i;
            
            if (isSelected) li.classList.add('selected');
            
            li.innerHTML = `<input type="radio" name="opt" ${isSelected ? 'checked' : ''}> ${char}. ${opt}`;
            li.onclick = () => saveAnswer(i);
            list.appendChild(li);
        });

        // Set Isi Pembahasan
        const correctChar = String.fromCharCode(65 + q.correct);
        document.getElementById('exp-key').innerText = `${correctChar}. ${q.a[q.correct]}`;
        document.getElementById('exp-text').innerHTML = q.exp.replace(/\n/g, '<br>');

        // Default: Sembunyikan pembahasan & tampilkan ikon mata tertutup saat pindah soal
        document.getElementById('exp-content-current').style.display = 'none';
        document.getElementById('exp-eye-icon').innerText = '🙈';

        document.getElementById('prev-btn').disabled = currentIdx === 0;
        document.getElementById('next-btn').disabled = currentIdx === questions.length - 1;
        renderPanel();
    }

    function toggleCurrentExp() {
        const content = document.getElementById('exp-content-current');
        const eyeIcon = document.getElementById('exp-eye-icon');
        
        if (content.style.display === 'block') {
            content.style.display = 'none';
            eyeIcon.innerText = '🙈'; // Mata tertutup
        } else {
            content.style.display = 'block';
            eyeIcon.innerText = '👁️'; // Mata terbuka
        }
    }

    function saveAnswer(i) {
        userAnswers[currentIdx] = i;
        showQuestion(); 
    }

    function manualChange(step) {
        currentIdx += step;
        showQuestion();
        startTimer(); 
    }

    function autoNext() {
        if (currentIdx < questions.length - 1) {
            currentIdx++;
            showQuestion();
            startTimer();
        } else {
            clearInterval(timerInterval);
            alert("Waktu habis atau ujian telah selesai.");
            finishQuiz();
        }
    }

    function renderPanel() {
        const panel = document.getElementById('number-panel');
        panel.innerHTML = '';
        questions.forEach((_, i) => {
            const btn = document.createElement('button');
            btn.innerText = i + 1;
            let cls = 'num-btn';
            if (i === currentIdx) cls += ' active';
            if (userAnswers[i] !== null) cls += ' filled';
            btn.className = cls;
            btn.onclick = () => { currentIdx = i; showQuestion(); startTimer(); };
            panel.appendChild(btn);
        });
    }

    function confirmFinish() {
        const unanswered = userAnswers.filter(ans => ans === null).length;
        let msg = "Apakah Anda yakin ingin menyelesaikan ujian?";
        if (unanswered > 0) {
            msg = `Masih ada ${unanswered} soal yang belum dijawab. ` + msg;
        }
        if (confirm(msg)) {
            finishQuiz();
        }
    }

    function toggleExplanation(id) {
        const body = document.getElementById(`exp-body-${id}`);
        const icon = document.getElementById(`exp-icon-${id}`);
        if (body.style.display === "block") {
            body.style.display = "none";
            icon.innerText = "▼";
        } else {
            body.style.display = "block";
            icon.innerText = "▲";
        }
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        let score = 0;
        let expHtml = '';
        
        questions.forEach((q, i) => {
            const isCorrect = userAnswers[i] === q.correct;
            if (isCorrect) score++;
            
            const userChar = userAnswers[i] !== null ? String.fromCharCode(65 + userAnswers[i]) : 'Kosong';
            const correctChar = String.fromCharCode(65 + q.correct);

            expHtml += `
                <div class="explanation-item">
                    <div class="explanation-header" onclick="toggleExplanation(${i})">
                        <span>Soal ${i+1}: <span class="${isCorrect ? 'badge-correct' : 'badge-wrong'}">${isCorrect ? 'BENAR' : 'SALAH'}</span> (Jawaban Anda: ${userChar} | Kunci: ${correctChar})</span>
                        <span id="exp-icon-${i}">▼</span>
                    </div>
                    <div class="explanation-body" id="exp-body-${i}">
                        <p><b>Pertanyaan:</b> ${q.q.replace(/\n/g, '<br>')}</p>
                        <p><b>Kunci Jawaban:</b> ${correctChar}. ${q.a[q.correct]}</p>
                        <p><b>Pembahasan:</b> ${q.exp.replace(/\n/g, '<br>')}</p>
                    </div>
                </div>
            `;
        });

        const finalScore = (score / questions.length) * 100;

        document.getElementById('score-text').innerHTML = `Skor Akhir: ${finalScore.toFixed(1)} / 100 (${score} dari ${questions.length} benar)`;
        document.getElementById('explanation-list').innerHTML = expHtml;
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('timer-box').style.display = 'none';
        
        // Tampilkan jawaban pada soal aktif saat selesai
        document.getElementById('exp-content-current').style.display = 'block';
        document.getElementById('exp-eye-icon').innerText = '👁️';
        
        window.scrollTo({ top: document.getElementById('result-area').offsetTop - 20, behavior: 'smooth' });
    }

    init();
</script>

</body>
</html>
