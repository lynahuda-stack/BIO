<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi Kehadiran Siswa via Barcode & Kamera</title>
  <!-- Library SheetJS untuk Export Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Library HTML5-QRCode untuk Scan via Kamera -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1050px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 5px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .card {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }

    /* LAYOUT BERSAMPINGAN (GRID SIDE-BY-SIDE) */
    .scan-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 768px) {
      .scan-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #007bff;
      border-radius: 6px;
      font-size: 16px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #0056b3;
      background-color: #f0f8ff;
    }
    .btn-submit {
      background-color: #28a745;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
    }
    .btn-submit:hover {
      background-color: #218838;
    }

    /* CAMERA BOX STYLING */
    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      border: 2px dashed #007bff;
      background: #fafafa;
      min-height: 250px;
    }
    .cam-status {
      font-size: 12px;
      color: #28a745;
      font-weight: bold;
      margin-top: 5px;
      text-align: right;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .table-header h3 {
      margin: 0;
    }
    .btn-excel {
      background-color: #1d6f42;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-excel:hover {
      background-color: #155231;
    }
    .table-container {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background-color: white;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #007bff;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .jam-datang { color: #28a745; font-weight: bold; }
    .jam-pulang { color: #dc3545; font-weight: bold; }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      color: white;
    }
    .bg-hadir { background-color: #28a745; }
    .bg-pulang { background-color: #17a2b8; }
    
    .btn-action {
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-hapus { background-color: #dc3545; color: white; }
    .btn-hapus:hover { background-color: #c82333; }

    #statusSync, #scanNotif {
      text-align: center;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      font-weight: bold;
      font-size: 14px;
      display: none;
    }
    .sync-loading { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .sync-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .sync-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    
    .notif-datang { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .notif-pulang { background-color: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    .notif-gagal { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

<div class="container">
  <h2>Sistem Absensi Siswa via Barcode & Kamera</h2>
  <p class="subtitle">Scan via Kamera atau Input Manual / Scanner USB secara bersamaan</p>
  
  <div id="statusSync"></div>
  <div id="scanNotif"></div>

  <div class="card">
    <div class="scan-grid">
      <!-- KOTAK KIRI: INPUT MANUAL / SCANNER HARDWARE USB -->
      <div>
        <form id="absensiForm">
          <div class="form-group">
            <label for="barcodeInput">⌨️ Ketik NIS / Scan USB Barcode:</label>
            <input type="text" id="barcodeInput" placeholder="Masukkan NIS (contoh: 1001)..." autofocus autocomplete="off">
          </div>
          <button type="submit" class="btn-submit">Proses Absensi</button>
        </form>
      </div>

      <!-- KOTAK KANAN: KAMERA SCANNER (AUTO ON) -->
      <div>
        <label>📷 Scanner Kamera (Auto Active):</label>
        <div id="reader"></div>
        <div id="camTextStatus" class="cam-status">🟢 Memulai Kamera...</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="table-header">
      <h3>Rekapitulasi Absensi Hari Ini</h3>
      <button class="btn-excel" onclick="exportToExcel()">📊 Ekstrak ke Excel (.xlsx)</button>
    </div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Tanggal</th>
            <th>NIS</th>
            <th>Nama Siswa</th>
            <th>Kelas</th>
            <th>Jam Datang</th>
            <th>Jam Pulang</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabelData"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // PASTE URL DEPLOYMENT GOOGLE APPS SCRIPT ANDA DI BAWAH INI (JIKA ADA)
  const URL_SPREADSHEET = "https://script.google.com/macros/s/AKfycbz0zUz_GKSQGWcf0jrWFj9vKHl7DzzqyjrLU5UPChi2KZiBDmzKGxk2iqfA_xudqBw/exec";

  // DAFTAR MASTER DATA SISWA & KELAS TERTANAM (NIS sebagai KEY)
  let masterSiswa = {
    "1001": { nama: "ABDUL AZZIS", kelas: "X-A" },
    "1002": { nama: "AHMAD HAIKAL AMIRUDDIN", kelas: "X-A" },
    "1003": { nama: "DIMAS SAKTIAWAN WICAKSONO", kelas: "X-A" },
    "1004": { nama: "MUHAMMAD", kelas: "X-A" },
    "1005": { nama: "NAFI' OKTA FIRNANDA", kelas: "X-A" },
    "1006": { nama: "ALFIAN ADE SETYAWAN", kelas: "X-A" },
    "1007": { nama: "DANIAL ANDREAN EKA SAPUTRA", kelas: "X-A" },
    "1008": { nama: "ISNANDIKA NURAHMAT", kelas: "X-A" },
    "1009": { nama: "M. AIRLANGGA ALFARISI", kelas: "X-B" },
    "1010": { nama: "M.ILHAM NUR SIDIK", kelas: "X-B" },
    "1011": { nama: "M.RINO FADILAH", kelas: "X-B" },
    "1012": { nama: "SYAVA INDRA KUSUMA", kelas: "X-B" },
    "1013": { nama: "AHMAD MUZAMMIL", kelas: "X-B" },
    "1014": { nama: "AHMAD ZAQI SETIAWAN", kelas: "X-B" },
    "1015": { nama: "MOHAMAD ALIM MUAFIF", kelas: "X-B" },
    "1016": { nama: "MUHAMMAD GALANG ANDIKA SETIAWAN", kelas: "X-B" }
  };

  let html5QrCode = null;
  let isProcessingScan = false;

  const absensiForm = document.getElementById('absensiForm');
  const barcodeInput = document.getElementById('barcodeInput');
  const tabelData = document.getElementById('tabelData');
  const statusSync = document.getElementById('statusSync');
  const scanNotif = document.getElementById('scanNotif');
  const camTextStatus = document.getElementById('camTextStatus');

  document.addEventListener('DOMContentLoaded', () => {
    loadData();
    fetchMasterSiswa(); // Sinkronkan ke spreadsheet jika URL valid
    initAutoCamera();   // Jalankan Kamera Otomatis saat Halaman Dibuka
  });

  // FUNGSI INISIALISASI KAMERA AUTO-ON
  function initAutoCamera() {
    html5QrCode = new Html5Qrcode("reader");
    
    const config = { 
      fps: 10, 
      qrbox: { width: 220, height: 140 },
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    };

    html5QrCode.start(
      { facingMode: "environment" },
      config,
      onScanSuccess,
      onScanFailure
    ).then(() => {
      camTextStatus.innerText = "🟢 Kamera Aktif & Siap Scan";
    }).catch(err => {
      console.error("Kamera Auto-On gagal:", err);
      camTextStatus.style.color = "#dc3545";
      camTextStatus.innerText = "🔴 Gagal Membuka Kamera (Berikan Izin Akses Browser)";
    });
  }

  function onScanSuccess(decodedText) {
    if (isProcessingScan) return; 
    
    isProcessingScan = true;
    prosesAbsensiSiswa(decodedText.trim());

    setTimeout(() => {
      isProcessingScan = false;
    }, 2500);
  }

  function onScanFailure(error) {
    // Abaikan error pembacaan frame per sekon
  }

  function getTanggalSekarang() {
    return new Date().toLocaleDateString('id-ID');
  }

  function getJamSekarang() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + 
           String(d.getMinutes()).padStart(2, '0') + ':' + 
           String(d.getSeconds()).padStart(2, '0');
  }

  // Tarik Master Data Siswa tambahan dari Spreadsheet (Opsional)
  function fetchMasterSiswa() {
    if (!URL_SPREADSHEET) return;
    showStatus("🔄 Memuat Master Data Siswa dari Spreadsheet...", "sync-loading");

    fetch(URL_SPREADSHEET)
      .then(res => res.json())
      .then(result => {
        if (result.status === "success" && result.data) {
          masterSiswa = { ...masterSiswa, ...result.data };
          showStatus("✅ Master Data Siswa Siap!", "sync-success");
        }
      })
      .catch(err => {
        console.log("Menggunakan master data lokal.", err);
        showStatus("ℹ️ Menggunakan data siswa lokal.", "sync-success");
      });
  }

  // Sync Data ke Google Spreadsheet
  function autoSyncSpreadsheet(actionType, dataPayload) {
    if (!URL_SPREADSHEET) return;
    showStatus("🔄 Menyinkronkan ke Spreadsheet...", "sync-loading");

    fetch(URL_SPREADSHEET, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: actionType, data: dataPayload })
    })
    .then(() => {
      showStatus("✅ Data tersinkronisasi ke Spreadsheet!", "sync-success");
    })
    .catch(err => {
      console.error(err);
      showStatus("⚠️ Gagal menyinkronkan data.", "sync-error");
    });
  }

  function showStatus(message, className) {
    statusSync.style.display = "block";
    statusSync.className = className;
    statusSync.innerText = message;
    if (className === "sync-success") setTimeout(() => { statusSync.style.display = "none"; }, 3000);
  }

  function showScanNotif(message, className) {
    scanNotif.style.display = "block";
    scanNotif.className = className;
    scanNotif.innerText = message;
    setTimeout(() => { scanNotif.style.display = "none"; }, 4000);
  }

  // PROSES ABSENSI UTAMA (Dengan Batasan Jam Datang & Pulang)
  function prosesAbsensiSiswa(nis) {
    if (!nis) return;

    const siswa = masterSiswa[nis] || { nama: "Siswa Unregistered (" + nis + ")", kelas: "-" };
    let listAbsensi = JSON.parse(localStorage.getItem('listAbsensiSiswa')) || [];
    const tglHariIni = getTanggalSekarang();
    const jamSekarang = getJamSekarang();

    // Hitung total menit & detik untuk evaluasi jam operasional
    const sekarang = new Date();
    const jamInteger = sekarang.getHours();
    const menitInteger = sekarang.getMinutes();
    const detikInteger = sekarang.getSeconds();

    const totalMenitSekarang = (jamInteger * 60) + menitInteger;
    const batasAwalMasuk = 5 * 60;   // Pukul 05:00
    const batasAkhirMasuk = 13 * 60; // Pukul 13:00

    let indexData = listAbsensi.findIndex(item => item.nis === nis && item.tanggal === tglHariIni);

    if (indexData === -1) {
      // LOGIKA ABSEN DATANG (05.00 - 13.00)
      if (totalMenitSekarang < batasAwalMasuk) {
        showScanNotif(`⚠️ Absen Datang belum dibuka. Jam masuk dimulai pukul 05:00 WIB.`, "notif-gagal");
        return;
      }

      if (totalMenitSekarang > batasAkhirMasuk) {
        showScanNotif(`⚠️ Absen Datang sudah ditutup (Batas maksimal pukul 13:00 WIB).`, "notif-gagal");
        return;
      }

      // SIMPAN ABSEN DATANG
      const dataBaru = {
        id: Date.now(),
        tanggal: tglHariIni,
        nis: nis,
        nama: siswa.nama,
        kelas: siswa.kelas,
        jamDatang: jamSekarang,
        jamPulang: '-',
        status: 'Sudah Hadir'
      };

      listAbsensi.push(dataBaru);
      localStorage.setItem('listAbsensiSiswa', JSON.stringify(listAbsensi));
      
      showScanNotif(`🟢 ABSEN DATANG: ${siswa.nama} (${siswa.kelas}) jam ${jamSekarang}`, "notif-datang");
      autoSyncSpreadsheet("ADD", dataBaru);

    } else {
      // LOGIKA ABSEN PULANG (Hanya Bisa Ditempuh Setelah Jam 13:00)
      if (listAbsensi[indexData].jamPulang === '-') {
        
        if (totalMenitSekarang < batasAkhirMasuk || (totalMenitSekarang === batasAkhirMasuk && detikInteger === 0)) {
          showScanNotif(`⚠️ Absen Pulang belum dibuka. Jam pulang baru bisa dilakukan setelah pukul 13:00 WIB.`, "notif-gagal");
          return;
        }

        // SIMPAN ABSEN PULANG
        listAbsensi[indexData].jamPulang = jamSekarang;
        listAbsensi[indexData].status = 'Sudah Pulang';

        localStorage.setItem('listAbsensiSiswa', JSON.stringify(listAbsensi));

        showScanNotif(`🔵 ABSEN PULANG: ${siswa.nama} (${siswa.kelas}) jam ${jamSekarang}`, "notif-pulang");
        autoSyncSpreadsheet("UPDATE", listAbsensi[indexData]);
      } else {
        showScanNotif(`⚠️ ${siswa.nama} sudah melakukan ABSEN PULANG hari ini pada jam ${listAbsensi[indexData].jamPulang}`, "notif-gagal");
      }
    }

    loadData();
  }

  // Handle Input Manual Submit
  absensiForm.addEventListener('submit', function(e) {
    e.preventDefault();
    const nis = barcodeInput.value.trim();
    barcodeInput.value = '';
    prosesAbsensiSiswa(nis);
    barcodeInput.focus();
  });

  function loadData() {
    tabelData.innerHTML = '';
    let listAbsensi = JSON.parse(localStorage.getItem('listAbsensiSiswa')) || [];

    if (listAbsensi.length === 0) {
      tabelData.innerHTML = '<tr><td colspan="9" style="text-align:center;">Belum ada data absensi hari ini.</td></tr>';
      return;
    }

    listAbsensi.slice().reverse().forEach((item, index) => {
      const tr = document.createElement('tr');
      const badgeStatus = item.status === 'Sudah Pulang' 
        ? `<span class="badge bg-pulang">Sudah Pulang</span>`
        : `<span class="badge bg-hadir">Sudah Hadir</span>`;

      tr.innerHTML = `
        <td>${index + 1}</td>
        <td>${item.tanggal}</td>
        <td>${item.nis}</td>
        <td>${item.nama}</td>
        <td>${item.kelas}</td>
        <td class="jam-datang">${item.jamDatang}</td>
        <td class="jam-pulang">${item.jamPulang}</td>
        <td>${badgeStatus}</td>
        <td><button class="btn-action btn-hapus" onclick="hapusData(${item.id})">Hapus</button></td>
      `;
      tabelData.appendChild(tr);
    });
  }

  function hapusData(id) {
    if (confirm("Apakah Anda yakin ingin menghapus data absensi ini?")) {
      let listAbsensi = JSON.parse(localStorage.getItem('listAbsensiSiswa')) || [];
      const itemToDelete = listAbsensi.find(item => item.id === id);
      
      listAbsensi = listAbsensi.filter(item => item.id !== id);
      localStorage.setItem('listAbsensiSiswa', JSON.stringify(listAbsensi));
      loadData();

      if (itemToDelete) autoSyncSpreadsheet("DELETE", itemToDelete);
    }
  }

  function exportToExcel() {
    let listAbsensi = JSON.parse(localStorage.getItem('listAbsensiSiswa')) || [];
    if (listAbsensi.length === 0) return alert("Tidak ada data untuk diekstrak!");

    const dataExcel = listAbsensi.map((item, index) => ({
      "No": index + 1,
      "Tanggal": item.tanggal,
      "NIS": item.nis,
      "Nama Siswa": item.nama,
      "Kelas": item.kelas,
      "Jam Datang": item.jamDatang,
      "Jam Pulang": item.jamPulang,
      "Status": item.status
    }));

    const worksheet = XLSX.utils.json_to_sheet(dataExcel);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap Absensi");
    XLSX.writeFile(workbook, `Absensi_Siswa_${new Date().toISOString().split('T')[0]}.xlsx`);
  }
</script>

</body>
</html>
